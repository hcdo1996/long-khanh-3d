<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Công viên Tượng đài Chiến thắng Long Khánh 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc4e8; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #view { position: fixed; inset: 0; touch-action: none; }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .panel { background: rgba(18, 28, 38, .72); border-radius: 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #title { position: fixed; top: 10px; left: 10px; right: 176px; max-width: 420px; padding: 8px 12px 9px; pointer-events: none; font-size: 15px; font-weight: 800; line-height: 1.25; letter-spacing: .04em; }
  #title .sub { display: block; font-size: 11.5px; font-weight: 500; letter-spacing: 0; opacity: .88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #title .chip { display: inline-block; margin-top: 5px; padding: 3px 9px; border-radius: 9px; background: rgba(255,255,255,.13); font-size: 12.5px; font-weight: 700; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  #shot { bottom: 22px; right: 132px; width: 46px; height: 42px; padding: 0; font-size: 19px; border-radius: 50%; }
  .note p.done { opacity: .6; text-decoration: line-through; }
  #fps { bottom: 70px; right: 132px; width: 46px; height: 42px; padding: 0; font-size: 11px; font-weight: 700; border-radius: 50%; }
  #perf { position: fixed; left: 10px; bottom: 160px; z-index: 5; display: none; padding: 8px 10px; font: 11.5px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre; pointer-events: auto; max-width: calc(100vw - 20px); overflow: hidden; }
  #perf button { font: inherit; margin-top: 5px; margin-right: 6px; padding: 6px 9px; border: 0; border-radius: 8px; background: rgba(255,255,255,.16); color: #fff; cursor: pointer; }
  #map { position: fixed; top: 10px; right: 10px; width: 156px; height: 108px; border-radius: 12px; background: rgba(18, 28, 38, .62); pointer-events: none; }
  /* permanent controls (not notifications) */
  #bar { position: fixed; top: 126px; left: 10px; display: flex; gap: 2px; padding: 4px; max-width: calc(100vw - 20px); }
  #bar button { border: 0; background: transparent; color: #fff; font: inherit; font-size: 12px; padding: 9px 9px; border-radius: 9px; cursor: pointer; min-height: 36px; }
  #bar button[aria-pressed="true"] { background: #f2c14e; color: #17212b; font-weight: 700; }
  #simnote { position: fixed; top: 176px; left: 12px; font-size: 11px; padding: 3px 8px; border-radius: 8px; background: rgba(18, 28, 38, .72); display: none; pointer-events: none; max-width: calc(100vw - 40px); }
  .btn { position: fixed; right: 12px; border: 0; color: #fff; font: inherit; font-size: 13px; padding: 11px 14px; cursor: pointer; }
  #home { bottom: 22px; } #tank { bottom: 70px; } #qual { bottom: 118px; } #help { bottom: 166px; } #wx { bottom: 214px; } #xmas { bottom: 262px; }
  button:focus-visible { outline: 3px solid #ffe08a; outline-offset: 2px; }
  #joy { position: fixed; left: 22px; bottom: 26px; width: 124px; height: 124px; border-radius: 50%;
         background: rgba(18, 28, 38, .38); border: 2px solid rgba(255,255,255,.5); touch-action: none; display: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.85); pointer-events: none; }
  /* notifications: every card carries its own X */
  #notes { position: fixed; top: 204px; left: 10px; right: 10px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; pointer-events: none; max-height: max(150px, calc(100vh - 520px)); overflow-y: auto; }
  .note { position: relative; box-sizing: border-box; max-width: min(460px, 100%); padding: 11px 106px 11px 13px; min-height: 52px; font-size: 13px; line-height: 1.42; pointer-events: auto; background: rgba(14, 22, 31, .9); border: 1px solid rgba(255,255,255,.16); }
  .note.err { border-color: #ff8f7a; }
  .note b { display: block; margin-bottom: 3px; font-size: 13.5px; }
  .note p { margin: 0 0 5px; } .note p:last-child { margin-bottom: 0; }
  .note a { color: #ffe08a; }
  .note .x { position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; border-radius: 10px; background: rgba(255,255,255,.14); color: #fff; font-size: 22px; line-height: 1; cursor: pointer; }
  .note .x:hover, .note .mn:hover { background: rgba(255,255,255,.28); }
  .note .mn { position: absolute; top: 4px; right: 52px; width: 44px; height: 44px; border: 0; border-radius: 10px; background: rgba(255,255,255,.14); color: #fff; font-size: 24px; line-height: 1; cursor: pointer; }
  .note.min p { display: none; } .note.min b { margin-bottom: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 30px; }
  @media (max-height: 520px) {      /* phones held sideways */
    #bar { top: 58px; max-width: calc(100vw - 190px); } #simnote { top: 104px; }
    #notes { top: 108px; right: 200px; max-height: calc(100vh - 118px); }
    #joy { width: 104px; height: 104px; bottom: 14px; }
    #title .sub { display: none; } #title { padding: 5px 10px 6px; } #title .chip { margin-top: 2px; } #shot { bottom: 104px; right: 124px; } #fps { bottom: 148px; right: 124px; } #perf { bottom: 8px; left: 130px; }
    #help { bottom: 148px; } #qual { bottom: 104px; } #tank { bottom: 60px; } #home { bottom: 16px; } .btn { padding: 9px 12px; } #wx { bottom: 16px; right: 124px; } #xmas { bottom: 60px; right: 124px; }
  }
  #boot { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
          background: linear-gradient(#1c2f45, #0f1a27); transition: opacity .5s; }
  #boot.off { opacity: 0; pointer-events: none; }
  #boot h1 { font-size: 20px; margin: 0; line-height: 1.3; } #boot p { margin: 0; font-size: 13px; opacity: .85; }
  #bootbar { width: min(280px, 70vw); height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
  #bootfill { width: 4%; height: 100%; background: #f2c14e; transition: width .25s; }
  #bootskip { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border: 0; border-radius: 10px; background: rgba(255,255,255,.14); color: #fff; font-size: 22px; cursor: pointer; }
</style>
</head>
<body>
<div id="view" role="application" aria-label="Cảnh 3D công viên Tượng đài Chiến thắng Long Khánh"></div>
<div id="boot" role="status"><h1>Công viên Tượng đài<br>Chiến thắng Long Khánh</h1><div id="bootbar"><div id="bootfill"></div></div><p id="boottext">Đang tải mô hình…</p>
  <button id="bootskip" type="button" aria-label="Đóng màn hình tải và vào ngay">×</button></div>
<div id="title" class="panel">LONG KHÁNH<span class="sub">Công viên Tượng đài Chiến thắng · Đồng Nai</span><span class="chip" id="chip" title="Giờ, thời tiết và nhiệt độ mô phỏng">10:30 · Nắng · 31°C</span></div>
<canvas id="map"></canvas>
<div id="bar" class="panel" role="group" aria-label="Ánh sáng">
  <button data-mode="day" aria-pressed="true">Ngày</button><button data-mode="sunset" aria-pressed="false">Hoàng hôn</button><button data-mode="night" aria-pressed="false">Đêm</button><button data-mode="auto" aria-pressed="false">Tự động</button>
</div>
<div id="simnote">Mô phỏng: 10 phút = 1 ngày (không phải giờ thật)</div>
<div id="notes" aria-live="polite"></div>
<div id="joy"><div id="knob"></div></div>
<button id="help" class="panel btn" aria-label="Hướng dẫn và ghi công">? Trợ giúp</button>
<button id="shot" class="panel btn" aria-label="Chụp ảnh lưu niệm">📷</button>
<button id="fps" class="panel btn" aria-label="Bật tắt bảng hiệu năng" aria-pressed="false">FPS</button>
<div id="perf" class="panel" role="status" aria-live="off"><span id="perftext"></span>
<button id="benchgo" type="button">Chạy đo mức này</button><button id="benchall" type="button">Đo cả 3 mức</button></div>
<button id="xmas" class="panel btn" aria-pressed="true">Noel: Bật</button>
<button id="wx" class="panel btn">Thời tiết: Nắng</button>
<button id="qual" class="panel btn">Đồ họa</button>
<button id="tank" class="panel btn">Tới xe tăng</button>
<button id="home" class="panel btn">Về điểm đầu</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  // ---------- notifications: one code path for every card (welcome, info, loading, errors, credits); each has an X and a minimise (–) button ----------
  var NOTES = { el: $('notes'), open: [], dismissed: {} };
  function closeNote(id, byUser) {
    for (var i = 0; i < NOTES.open.length; i++) if (NOTES.open[i].id === id) {
      var n = NOTES.open[i], hadFocus = n.el.contains(document.activeElement);
      NOTES.open.splice(i, 1); if (n.el.parentNode) n.el.parentNode.removeChild(n.el);
      if (byUser) { NOTES.dismissed[id] = Date.now(); if (hadFocus) { try { $('help').focus(); } catch (e) {} } }
      return true;
    }
    return false;
  }
  function notify(id, title, lines, kind) {              // lines: array of strings, or [text, url] pairs rendered as links
    var cur = null; NOTES.open.forEach(function (n) { if (n.id === id) cur = n; });
    var el = cur ? cur.el : document.createElement('div');
    if (!cur) {
      el.className = 'note panel' + (kind === 'err' ? ' err' : ''); el.setAttribute('role', kind === 'err' ? 'alert' : 'status');
      ['pointerdown', 'pointerup', 'pointermove', 'click', 'wheel', 'touchstart'].forEach(function (ev) { el.addEventListener(ev, function (e) { e.stopPropagation(); }); });
      NOTES.el.appendChild(el); NOTES.open.push({ id: id, el: el });
    }
    while (el.firstChild) el.removeChild(el.firstChild);
    var b = document.createElement('b'); b.textContent = title; el.appendChild(b);
    lines.forEach(function (t) {
      var p = document.createElement('p');
      if (typeof t === 'string') { p.textContent = t; if (t.charAt(0) === '☑') p.className = 'done'; } else { p.appendChild(document.createTextNode(t[0] + ' ')); var a = document.createElement('a'); a.href = t[1]; a.textContent = t[2] || t[1]; a.target = '_blank'; a.rel = 'noopener'; p.appendChild(a); }
      el.appendChild(p);
    });
    var x = document.createElement('button'); x.className = 'x'; x.type = 'button'; x.setAttribute('aria-label', 'Đóng thông báo: ' + title); x.textContent = '×';
    x.addEventListener('click', function (e) { e.stopPropagation(); closeNote(id, true); });
    var mn = document.createElement('button'); mn.className = 'mn'; mn.type = 'button';          // the "–" button folds the card down to its title; "+" opens it again
    function syncMin() { var on = el.classList.contains('min'); mn.textContent = on ? '+' : '–'; mn.setAttribute('aria-expanded', on ? 'false' : 'true'); mn.setAttribute('aria-label', (on ? 'Mở rộng thông báo: ' : 'Thu gọn thông báo: ') + title); }
    mn.addEventListener('click', function (e) { e.stopPropagation(); el.classList.toggle('min'); syncMin(); }); syncMin();
    el.appendChild(mn); el.appendChild(x);
    return el;
  }
  window.addEventListener('keydown', function (e) {       // Escape closes the topmost card
    if (e.key === 'Escape' && NOTES.open.length) { closeNote(NOTES.open[NOTES.open.length - 1].id, true); e.preventDefault(); }
  });
  function fatal(msg) { notify('fatal', 'Không mở được cảnh 3D', [msg], 'err'); }
  if (typeof THREE === 'undefined') { fatal('Không tải được thư viện đồ họa. Bạn kiểm tra kết nối mạng rồi tải lại trang.'); return; }
  var LOAD = { total: 0, done: 0, failed: 0, closed: false };
  function bootOff() { if (LOAD.closed) return; LOAD.closed = true; $('boot').className = 'off'; setTimeout(function () { $('boot').style.display = 'none'; }, 600); }
  $('bootskip').addEventListener('click', bootOff); setTimeout(bootOff, 30000);             // never trap the player on the loading screen
  THREE.DefaultLoadingManager.onProgress = function (url, loaded, total) {
    LOAD.total = total; LOAD.done = loaded; $('bootfill').style.width = Math.round(4 + 96 * loaded / Math.max(1, total)) + '%'; $('boottext').textContent = 'Đang tải mô hình… ' + loaded + ' / ' + total;
    if (!LOAD.closed) return;
    if (!NOTES.dismissed.loading && loaded < total) notify('loading', 'Đang tải mô hình', ['Đã tải ' + loaded + ' / ' + total + ' tệp. Bạn vẫn đi lại được trong lúc chờ.']);
  };
  THREE.DefaultLoadingManager.onLoad = function () { closeNote('loading', false); setTimeout(bootOff, 350); };
  THREE.DefaultLoadingManager.onError = function (url) {
    LOAD.failed++; notify('loaderr', 'Thiếu một số mô hình', ['Có ' + LOAD.failed + ' tệp không tải được. Cảnh vẫn dùng được, phần thiếu hiện bằng hình thay thế.'], 'err');
  };
  var FX = { wet: [], trees: null, glass: [], lamps: [], texts: [], shopMat: null, cloudMat: null, pools: [], blobs: [], dyn: [] };          // things the day / night controller and the quality tiers drive
  var UNI = { time: { value: 0 }, night: { value: 0 } };
  // custom shader 1: wind. Leaves, leaf cards and flowers sway in world space; movement grows with height so trunks and low shrubs stay put.
  var WIND_CHUNK = [
    'vec4 mvPosition = vec4( transformed, 1.0 );', '#ifdef USE_INSTANCING', '  mvPosition = instanceMatrix * mvPosition;', '#endif', 'mvPosition = modelMatrix * mvPosition;',
    'float wW = clamp( ( mvPosition.y - 2.2 ) / 6.0, 0.0, 1.0 );',
    'mvPosition.x += ( sin( uTime * 1.4 + mvPosition.x * 0.31 + mvPosition.z * 0.27 ) * 0.085 + sin( uTime * 3.1 + mvPosition.z * 1.3 ) * 0.02 ) * wW;',
    'mvPosition.z += cos( uTime * 1.1 + mvPosition.x * 0.23 - mvPosition.z * 0.33 ) * 0.07 * wW;',
    'mvPosition = viewMatrix * mvPosition;', 'gl_Position = projectionMatrix * mvPosition;'].join('\n');
  function windify(m) { m.onBeforeCompile = function (sh) { sh.uniforms.uTime = UNI.time; sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <project_vertex>', WIND_CHUNK); }; return m; }
  // custom shader 2: lit windows. At night about half the window panes of each facade glow warm; which ones is a hash of the pane and the building's tint.
  function windowize(m, floors) {
    m.onBeforeCompile = function (sh) {
      sh.uniforms.uNight = UNI.night; sh.uniforms.uFloors = { value: floors };
      sh.fragmentShader = 'uniform float uNight;\nuniform float uFloors;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>', [
        '#include <emissivemap_fragment>',
        'float wU = vUv.x * 512.0 - 26.0, wV = ( 1.0 - vUv.y ) * 160.0 * uFloors;',                 // same layout the facade texture is drawn with: 4 bays, one pane per bay and floor
        'float wC = floor( wU / 122.0 ), wR = floor( wV / 160.0 ), wX = wU - wC * 122.0, wY = wV - wR * 160.0;',
        'float wPane = step( 0.0, wU ) * step( wC, 3.0 ) * step( 1.0, wX ) * step( wX, 73.0 ) * step( 31.0, wY ) * step( wY, 121.0 );',
        'vec2 wCell = vec2( wC, wR );',
        '#ifdef USE_COLOR', 'wCell += floor( vColor.rg * 255.0 );', '#endif',
        'float wH = fract( sin( dot( wCell, vec2( 12.9898, 78.233 ) ) ) * 43758.5453 );',
        'float wOn = step( 0.34, wH ) * ( 0.55 + 0.45 * fract( wH * 7.0 ) );',
        'totalEmissiveRadiance += vec3( 1.0, 0.72, 0.38 ) * wPane * wOn * uNight;'].join('\n'));
    };
    return m;
  }

  // custom shader 3: the glass of the imported shophouses. At night some windows and most shopfronts glow; which ones is a hash of the house position, floor and side.
  function glassGlow(m) {
    m.onBeforeCompile = function (sh) {
      sh.uniforms.uNight = UNI.night;
      sh.vertexShader = 'varying float vLit;\nattribute float aSeed;\n' + sh.vertexShader.replace('#include <begin_vertex>', ['#include <begin_vertex>', 'vLit = 0.0;', '#ifdef USE_INSTANCING',
        'float gFloor = floor( position.y / 3.2 ), gCell = gFloor * 7.0 + step( 0.0, position.x ) * 3.0 * step( 0.5, gFloor );',
        'float gH = fract( sin( aSeed * 91.7 + gCell * 12.9898 ) * 43758.5453 );',
        'vLit = step( mix( 0.12, 0.3, step( 0.5, gFloor ) ), gH ) * ( 0.6 + 0.4 * fract( gH * 7.0 ) );', '#endif'].join('\n'));
      sh.fragmentShader = 'uniform float uNight;\nvarying float vLit;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += vec3( 1.0, 0.72, 0.38 ) * vLit * uNight * 1.0;');
    };
    return m;
  }

  // ---------- helpers ----------
  var seed = 20010415;
  function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  function rr(a, b) { return a + (b - a) * rnd(); }
  function distSeg(px, pz, ax, az, bx, bz) {
    var dx = bx - ax, dz = bz - az, l2 = dx * dx + dz * dz;
    var t = l2 ? ((px - ax) * dx + (pz - az) * dz) / l2 : 0; t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + dx * t), pz - (az + dz * t));
  }
  // convex polygon: prepared edges with inward normals; inPoly(p, x, z, m) => at least m metres inside
  function prep(pts) {
    var cx = 0, cz = 0, e = [], i; for (i = 0; i < pts.length; i++) { cx += pts[i][0]; cz += pts[i][1]; }
    cx /= pts.length; cz /= pts.length;
    for (i = 0; i < pts.length; i++) {
      var a = pts[i], b = pts[(i + 1) % pts.length], dx = b[0] - a[0], dz = b[1] - a[1], l = Math.hypot(dx, dz), nx = -dz / l, nz = dx / l;
      if ((cx - a[0]) * nx + (cz - a[1]) * nz < 0) { nx = -nx; nz = -nz; }
      e.push([a[0], a[1], nx, nz]);
    }
    return { pts: pts, e: e };
  }
  function inPoly(p, x, z, m) { for (var i = 0; i < p.e.length; i++) { var e = p.e[i]; if ((x - e[0]) * e[2] + (z - e[1]) * e[3] < m) return false; } return true; }

  // ============================================================
  //  LAYOUT (metres). Own frame: +x = towards the tip / tank (real-world SOUTH), +z = Quốc lộ 1 side (real-world WEST).
  //  Sizes are traced from the Esri satellite image (~0.59 m per pixel, a few metres of error) and the photos.
  //  They are estimates, kept as parameters so they are easy to tune. See assumptions.md.
  // ============================================================
  var BACK_X = -57, TIP_X = 57, BACK_HALF = 33, TIP_HALF = 10;
  var SLOPE = (BACK_HALF - TIP_HALF) / (TIP_X - BACK_X);
  function half(x) { return TIP_HALF + (TIP_X - x) * SLOPE; }                                        // park half-width at x
  var PARK = prep([[BACK_X, -BACK_HALF], [TIP_X, -TIP_HALF], [TIP_X, TIP_HALF], [BACK_X, BACK_HALF]]);
  var GORE = prep([[55, -13], [55, 26], [160, 13], [160, -2]]);                                      // asphalt between the roads past the tip
  var ISLAND = prep([[66, -4], [104, 3.5], [104, 10.5], [66, 14]]);                                  // tank island: separate from the park, shifted to the Quốc lộ 1 side
  var LAWN = prep([[68.5, -1.4], [101.5, 5.2], [101.5, 8.6], [68.5, 11.6]]);
  var TANK = { x: 78, z: 5.4, yaw: -0.55 };

  // raised terrace and steps. 12 steps in total is from written sources; the 6 + 6 split is an assumption -> parameters.
  var BAND = 5, TER_X0 = 0, TER_X1 = -52;
  function terLim(x) { return half(x) - BAND; }
  var STAIR_HALF = 9, STEP_H = 0.15, TREAD = 0.35, NSTEP1 = 6, NSTEP2 = 6, LANDING = 5.9;
  var F1_X = 0, LAND_X = F1_X - NSTEP1 * TREAD - LANDING, F2_END = LAND_X - NSTEP2 * TREAD;
  var G0 = 0.1, MID_Y = G0 + NSTEP1 * STEP_H, TY = MID_Y + NSTEP2 * STEP_H;

  // monument: 9 m pedestal + 12 m statue = 21 m is the published figure (reference only, not a survey)
  var M = { x: -34, z: 0 };
